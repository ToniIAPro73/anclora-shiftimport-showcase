<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="DM Sans, system-ui, sans-serif" role="img" aria-label="Mockup del modal de importacion de Anclora ShiftImport">
  <title>Importar cuadrante — mockup sintético</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#14210F" flood-opacity="0.22"/>
    </filter>
    <style>
      .wm { font-size: 16px; font-weight: 700; fill: #1F2A1C; }
      .wd { font-size: 11px; font-weight: 600; fill: #8A948A; }
      .dn { font-size: 11px; fill: #9AA59A; }
      .chipT { font-size: 11px; font-weight: 700; }
      .rM { fill: #E4F1DA; } .tM { fill: #3F7A26; }
      .rT { fill: #FBEBCB; } .tT { fill: #946200; }
      .rN { fill: #DFE7F4; } .tN { fill: #2C4A7A; }
      .rL { fill: #EBEEEA; } .tL { fill: #6E776E; }
      .rV { fill: #D9F0EC; } .tV { fill: #15756A; }
      .title { font-size: 20px; font-weight: 700; fill: #1F2A1C; }
      .sub { font-size: 12px; fill: #66716B; }
      .lbl { font-size: 11px; font-weight: 700; fill: #8A948A; letter-spacing: 1px; }
      .pillT { font-size: 12px; fill: #3A453A; }
      .btnP { font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .sel { font-size: 13px; fill: #2A352A; }
    </style>
  </defs>

  <!-- App de fondo (atenuada) -->
  <rect width="1280" height="800" fill="#F4F6F4"/>
  <rect width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E4E9E4"/>
  <rect x="24" y="20" width="24" height="24" rx="6" fill="#6AAD49"/>
  <text x="36" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">A</text>
  <text x="58" y="38" class="wm">Anclora <tspan fill="#6AAD49">ShiftImport</tspan></text>
  <circle cx="486" cy="32" r="14" fill="#FFFFFF" stroke="#C9D3C9"/>
  <path d="M 490 24 l -8 8 l 8 8" fill="none" stroke="#4A544A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2A1C">Septiembre 2026</text>
  <circle cx="794" cy="32" r="14" fill="#FFFFFF" stroke="#C9D3C9"/>
  <path d="M 790 24 l 8 8 l -8 8" fill="none" stroke="#4A544A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1168" y="37" text-anchor="end" font-size="12" fill="#4A544A">Usuario Demo</text>
  <circle cx="1194" cy="32" r="14" fill="#DDE7DA"/>
  <text x="1194" y="36" text-anchor="middle" font-size="11" font-weight="600" fill="#3A453A">UD</text>

  <!-- Calendario de fondo -->
