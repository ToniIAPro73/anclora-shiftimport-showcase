  <text x="293" y="92" text-anchor="middle" class="wd">M</text>
  <text x="466" y="92" text-anchor="middle" class="wd">X</text>
  <text x="640" y="92" text-anchor="middle" class="wd">J</text>
  <text x="814" y="92" text-anchor="middle" class="wd">V</text>
  <text x="987" y="92" text-anchor="middle" class="wd">S</text>
  <text x="1161" y="92" text-anchor="middle" class="wd">D</text>
  <rect x="32" y="104" width="1216" height="660" rx="10" fill="#FFFFFF" stroke="#E4E9E4"/>
  <line x1="206" y1="104" x2="206" y2="764" stroke="#E4E9E4"/>
  <line x1="379" y1="104" x2="379" y2="764" stroke="#E4E9E4"/>
  <line x1="553" y1="104" x2="553" y2="764" stroke="#E4E9E4"/>
  <line x1="727" y1="104" x2="727" y2="764" stroke="#E4E9E4"/>
  <line x1="901" y1="104" x2="901" y2="764" stroke="#E4E9E4"/>
  <line x1="1074" y1="104" x2="1074" y2="764" stroke="#E4E9E4"/>
  <line x1="32" y1="236" x2="1248" y2="236" stroke="#E4E9E4"/>
  <line x1="32" y1="368" x2="1248" y2="368" stroke="#E4E9E4"/>
  <line x1="32" y1="500" x2="1248" y2="500" stroke="#E4E9E4"/>
  <line x1="32" y1="632" x2="1248" y2="632" stroke="#E4E9E4"/>
  <text x="42" y="128" font-size="11" fill="#C4CDC4">31</text>
  <text x="216" y="128" class="dn">1</text>
  <text x="389" y="128" class="dn">2</text>
  <text x="563" y="128" class="dn">3</text>
  <text x="737" y="128" class="dn">4</text>
  <text x="911" y="128" class="dn">5</text>
  <text x="1084" y="128" class="dn">6</text>
  <text x="42" y="260" class="dn">7</text>
  <text x="216" y="260" class="dn">8</text>
  <text x="389" y="260" class="dn">9</text>
  <text x="563" y="260" class="dn">10</text>
  <text x="737" y="260" class="dn">11</text>
  <text x="911" y="260" class="dn">12</text>
  <text x="1084" y="260" class="dn">13</text>
  <text x="42" y="392" class="dn">14</text>
  <text x="216" y="392" class="dn">15</text>
  <text x="389" y="392" class="dn">16</text>
  <text x="563" y="392" class="dn">17</text>
  <text x="737" y="392" class="dn">18</text>
  <text x="42" y="524" class="dn">21</text>
  <text x="216" y="524" class="dn">22</text>
  <text x="42" y="656" class="dn">28</text>
  <text x="216" y="656" class="dn">29</text>
  <g opacity="0.6">
    <rect x="216" y="140" width="36" height="20" rx="5" class="rM"/><text x="234" y="154" text-anchor="middle" class="chipT tM">M</text>
    <rect x="389" y="140" width="36" height="20" rx="5" class="rM"/><text x="407" y="154" text-anchor="middle" class="chipT tM">M</text>
    <rect x="563" y="140" width="36" height="20" rx="5" class="rT"/><text x="581" y="154" text-anchor="middle" class="chipT tT">T</text>
    <rect x="737" y="140" width="36" height="20" rx="5" class="rT"/><text x="755" y="154" text-anchor="middle" class="chipT tT">T</text>
    <rect x="911" y="140" width="36" height="20" rx="5" class="rL"/><text x="929" y="154" text-anchor="middle" class="chipT tL">L</text>
    <rect x="42" y="272" width="36" height="20" rx="5" class="rN"/><text x="60" y="286" text-anchor="middle" class="chipT tN">N</text>
    <rect x="216" y="272" width="36" height="20" rx="5" class="rN"/><text x="234" y="286" text-anchor="middle" class="chipT tN">N</text>
    <rect x="389" y="272" width="36" height="20" rx="5" class="rM"/><text x="407" y="286" text-anchor="middle" class="chipT tM">M</text>
    <rect x="737" y="272" width="36" height="20" rx="5" class="rV"/><text x="755" y="286" text-anchor="middle" class="chipT tV">V</text>
    <rect x="42" y="404" width="36" height="20" rx="5" class="rT"/><text x="60" y="418" text-anchor="middle" class="chipT tT">T</text>
    <rect x="563" y="404" width="36" height="20" rx="5" class="rM"/><text x="581" y="418" text-anchor="middle" class="chipT tM">M</text>
