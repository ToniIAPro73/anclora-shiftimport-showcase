  <!-- Atenuacion -->
  <rect width="1280" height="800" fill="#14210F" opacity="0.45"/>

  <!-- Modal de importacion -->
  <rect x="330" y="140" width="620" height="530" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
  <line x1="916" y1="158" x2="930" y2="172" stroke="#7A857A" stroke-width="2" stroke-linecap="round"/>
  <line x1="930" y1="158" x2="916" y2="172" stroke="#7A857A" stroke-width="2" stroke-linecap="round"/>
  <text x="370" y="186" class="title">Importar cuadrante</text>
  <text x="370" y="210" class="sub">Selecciona el archivo del cuadrante y el mes al que corresponde.</text>

  <!-- Dropzone -->
  <rect x="370" y="232" width="540" height="180" rx="12" fill="#F7FAF6" stroke="#6AAD49" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M 640 292 V 268" stroke="#6AAD49" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 632 276 l 8 -8 l 8 8" fill="none" stroke="#6AAD49" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 616 296 v 8 h 48 v -8" fill="none" stroke="#6AAD49" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#2A352A">Arrastra tu archivo aquí</text>
  <text x="640" y="354" text-anchor="middle" font-size="12" fill="#8A948A">o</text>
  <rect x="550" y="364" width="180" height="36" rx="8" fill="#6AAD49"/>
  <text x="640" y="387" text-anchor="middle" class="btnP">Seleccionar archivo</text>

  <!-- Formatos compatibles -->
  <text x="370" y="444" class="lbl">FORMATOS COMPATIBLES</text>
  <rect x="370" y="456" width="52" height="28" rx="14" fill="#EFF4ED" stroke="#D8E2D4"/>
  <text x="396" y="474" text-anchor="middle" class="pillT">PDF</text>
  <rect x="432" y="456" width="116" height="28" rx="14" fill="#EFF4ED" stroke="#D8E2D4"/>
  <text x="490" y="474" text-anchor="middle" class="pillT">Imagen (OCR)</text>
  <rect x="558" y="456" width="52" height="28" rx="14" fill="#EFF4ED" stroke="#D8E2D4"/>
  <text x="584" y="474" text-anchor="middle" class="pillT">CSV</text>
  <rect x="620" y="456" width="66" height="28" rx="14" fill="#EFF4ED" stroke="#D8E2D4"/>
  <text x="653" y="474" text-anchor="middle" class="pillT">Excel</text>

  <!-- Selectores de mes y anyo -->
  <text x="370" y="524" class="lbl">MES DEL CUADRANTE</text>
  <rect x="370" y="536" width="170" height="36" rx="8" fill="#FFFFFF" stroke="#C9D3C9"/>
  <text x="384" y="559" class="sel">Septiembre</text>
  <path d="M 512 552 l 6 6 l 6 -6" fill="none" stroke="#66716B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="552" y="536" width="100" height="36" rx="8" fill="#FFFFFF" stroke="#C9D3C9"/>
  <text x="566" y="559" class="sel">2026</text>
  <path d="M 624 552 l 6 6 l 6 -6" fill="none" stroke="#66716B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nota -->
  <circle cx="376" cy="612" r="8" fill="#EFF4ED"/>
  <text x="376" y="616" text-anchor="middle" font-size="11" font-weight="700" fill="#3F7A26">i</text>
  <text x="392" y="616" font-size="12" fill="#66716B">El archivo se procesa localmente y se revisa antes de importar.</text>

  <!-- Caption -->
  <text x="1256" y="786" text-anchor="end" font-size="11" fill="#D5DDD5">Datos sintéticos — mockup de demostración</text>
</svg>
