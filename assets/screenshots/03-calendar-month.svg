  <text x="24" y="100" class="sideT">TIPOS DE TURNO</text>
  <rect x="24" y="112" width="32" height="22" rx="6" class="rM"/><text x="40" y="128" text-anchor="middle" class="chipT tM">M</text>
  <text x="68" y="128" class="lgN">Mañana</text><text x="68" y="145" class="lgS">07:00–15:00</text>
