  <text x="24" y="424" class="lgS">Los tipos de turno son</text>
  <text x="24" y="440" class="lgS">configurables por el usuario.</text>
  <text x="24" y="768" class="lgS">Datos sintéticos —</text>
  <text x="24" y="784" class="lgS">mockup de demostración</text>

