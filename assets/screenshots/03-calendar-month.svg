<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="DM Sans, system-ui, sans-serif" role="img" aria-label="Mockup del calendario mensual de Anclora ShiftImport">
  <title>Calendario mensual — mockup sintético</title>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#14210F" flood-opacity="0.08"/>
    </filter>
    <style>
      .wm { font-size: 16px; font-weight: 700; fill: #1F2A1C; }
      .wd { font-size: 12px; font-weight: 600; fill: #8A948A; }
      .dn { font-size: 12px; font-weight: 600; fill: #3A453A; }
      .dng { font-size: 12px; font-weight: 600; fill: #B4BEB4; }
      .chipT { font-size: 12px; font-weight: 700; }
      .rM { fill: #E4F1DA; } .tM { fill: #3F7A26; }
      .rT { fill: #FBEBCB; } .tT { fill: #946200; }
      .rN { fill: #DFE7F4; } .tN { fill: #2C4A7A; }
      .rL { fill: #EBEEEA; } .tL { fill: #6E776E; }
      .rV { fill: #D9F0EC; } .tV { fill: #15756A; }
      .sideT { font-size: 11px; font-weight: 700; fill: #8A948A; letter-spacing: 1px; }
      .lgN { font-size: 13px; font-weight: 600; fill: #2A352A; }
      .lgS { font-size: 11px; fill: #8A948A; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#F4F6F4"/>

  <!-- Cabecera -->
