<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="DM Sans, system-ui, sans-serif" role="img" aria-label="Mockup del panel de estadisticas de Anclora ShiftImport">
  <title>Resumen del mes — mockup sintético</title>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#14210F" flood-opacity="0.08"/>
    </filter>
    <style>
      .wm { font-size: 16px; font-weight: 700; fill: #1F2A1C; }
      .title { font-size: 22px; font-weight: 700; fill: #1F2A1C; }
      .cardT { font-size: 15px; font-weight: 600; fill: #2A352A; }
      .kpiL { font-size: 12px; font-weight: 600; fill: #8A948A; }
      .kpiV { font-size: 30px; font-weight: 700; fill: #1F2A1C; }
      .kpiS { font-size: 11px; fill: #8A948A; }
      .axis { font-size: 11px; fill: #8A948A; }
      .barV { font-size: 13px; font-weight: 700; fill: #2A352A; }
      .barL { font-size: 12px; fill: #66716B; }
      .lgT { font-size: 12px; fill: #3A453A; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#F4F6F4"/>

  <!-- Cabecera -->
  <rect width="1280" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#E4E9E4"/>
  <rect x="24" y="20" width="24" height="24" rx="6" fill="#6AAD49"/>
  <text x="36" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">A</text>
  <text x="58" y="38" class="wm">Anclora <tspan fill="#6AAD49">ShiftImport</tspan></text>
  <circle cx="486" cy="32" r="14" fill="#FFFFFF" stroke="#C9D3C9"/>
  <path d="M 490 24 l -8 8 l 8 8" fill="none" stroke="#4A544A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2A1C">Septiembre 2026</text>
  <circle cx="794" cy="32" r="14" fill="#FFFFFF" stroke="#C9D3C9"/>
  <path d="M 790 24 l 8 8 l -8 8" fill="none" stroke="#4A544A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1168" y="37" text-anchor="end" font-size="12" fill="#4A544A">Usuario Demo</text>
  <circle cx="1194" cy="32" r="14" fill="#DDE7DA"/>
  <text x="1194" y="36" text-anchor="middle" font-size="11" font-weight="600" fill="#3A453A">UD</text>

  <!-- Titulo del panel -->
  <text x="40" y="112" class="title">Resumen del mes — Septiembre 2026</text>

  <!-- Tarjetas KPI -->
  <rect x="40" y="140" width="285" height="112" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <circle cx="66" cy="168" r="4" fill="#6AAD49"/>
  <text x="78" y="172" class="kpiL">Horas trabajadas</text>
  <text x="64" y="212" class="kpiV">96 h</text>
  <text x="64" y="234" class="kpiS">≈ 8 h por día trabajado</text>

  <rect x="345" y="140" width="285" height="112" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <circle cx="371" cy="168" r="4" fill="#6AAD49"/>
  <text x="383" y="172" class="kpiL">Días trabajados</text>
  <text x="369" y="212" class="kpiV">12</text>
  <text x="369" y="234" class="kpiS">5 mañanas · 4 tardes · 3 noches</text>

  <rect x="650" y="140" width="285" height="112" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <circle cx="676" cy="168" r="4" fill="#6AAD49"/>
  <text x="688" y="172" class="kpiL">Libres</text>
  <text x="674" y="212" class="kpiV">6</text>
  <text x="674" y="234" class="kpiS">incluidos fines de semana</text>

  <rect x="955" y="140" width="285" height="112" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <circle cx="981" cy="168" r="4" fill="#15756A"/>
  <text x="993" y="172" class="kpiL">Vacaciones</text>
  <text x="979" y="212" class="kpiV">2</text>
  <text x="979" y="234" class="kpiS">días disfrutados en el mes</text>

  <!-- Grafico de barras: horas por semana -->
  <rect x="40" y="280" width="720" height="440" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="72" y="322" class="cardT">Horas por semana</text>
  <text x="728" y="322" text-anchor="end" class="kpiS">Total: 96 h</text>

  <line x1="96" y1="581" x2="712" y2="581" stroke="#E9EEE9" stroke-dasharray="4 4"/>
  <line x1="96" y1="514" x2="712" y2="514" stroke="#E9EEE9" stroke-dasharray="4 4"/>
  <line x1="96" y1="447" x2="712" y2="447" stroke="#E9EEE9" stroke-dasharray="4 4"/>
  <line x1="96" y1="380" x2="712" y2="380" stroke="#E9EEE9" stroke-dasharray="4 4"/>
  <text x="88" y="585" text-anchor="end" class="axis">8 h</text>
  <text x="88" y="518" text-anchor="end" class="axis">16 h</text>
  <text x="88" y="451" text-anchor="end" class="axis">24 h</text>
  <text x="88" y="384" text-anchor="end" class="axis">32 h</text>

  <rect x="136" y="380" width="88" height="268" rx="6" fill="#6AAD49"/>
  <rect x="284" y="447" width="88" height="201" rx="6" fill="#8BC16F"/>
  <rect x="432" y="514" width="88" height="134" rx="6" fill="#A8CF92"/>
  <rect x="580" y="447" width="88" height="201" rx="6" fill="#8BC16F"/>

  <text x="180" y="368" text-anchor="middle" class="barV">32 h</text>
  <text x="328" y="435" text-anchor="middle" class="barV">24 h</text>
  <text x="476" y="502" text-anchor="middle" class="barV">16 h</text>
  <text x="624" y="435" text-anchor="middle" class="barV">24 h</text>

  <line x1="96" y1="648" x2="712" y2="648" stroke="#C9D3C9"/>
  <text x="180" y="672" text-anchor="middle" class="barL">Semana 1</text>
  <text x="328" y="672" text-anchor="middle" class="barL">Semana 2</text>
  <text x="476" y="672" text-anchor="middle" class="barL">Semana 3</text>
  <text x="624" y="672" text-anchor="middle" class="barL">Semana 4</text>

  <!-- Donut: distribucion de turnos -->
  <rect x="780" y="280" width="460" height="440" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="812" y="322" class="cardT">Distribución de turnos</text>

  <circle cx="948" cy="500" r="70" fill="none" stroke="#EFF2EE" stroke-width="26"/>
  <circle cx="948" cy="500" r="70" fill="none" stroke="#6AAD49" stroke-width="26"
          stroke-dasharray="175.93 263.89" stroke-dashoffset="0" transform="rotate(-90 948 500)"/>
  <circle cx="948" cy="500" r="70" fill="none" stroke="#E5A63B" stroke-width="26"
          stroke-dasharray="153.94 285.89" stroke-dashoffset="-175.93" transform="rotate(-90 948 500)"/>
  <circle cx="948" cy="500" r="70" fill="none" stroke="#2C4A7A" stroke-width="26"
          stroke-dasharray="109.96 329.87" stroke-dashoffset="-329.87" transform="rotate(-90 948 500)"/>
  <text x="948" y="496" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2A1C">12 días</text>
  <text x="948" y="516" text-anchor="middle" font-size="11" fill="#8A948A">trabajados</text>

  <rect x="1080" y="451" width="12" height="12" rx="3" fill="#6AAD49"/>
  <text x="1100" y="462" class="lgT">Mañana — 40%</text>
  <rect x="1080" y="489" width="12" height="12" rx="3" fill="#E5A63B"/>
  <text x="1100" y="500" class="lgT">Tarde — 35%</text>
  <rect x="1080" y="527" width="12" height="12" rx="3" fill="#2C4A7A"/>
  <text x="1100" y="538" class="lgT">Noche — 25%</text>

  <text x="812" y="696" class="kpiS">Libres y vacaciones no incluidos en la distribución.</text>

  <!-- Caption -->
  <text x="1256" y="782" text-anchor="end" font-size="11" fill="#8A948A">Datos sintéticos — mockup de demostración</text>
</svg>
